name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint (errors fail, warnings are reported)
        run: npm run lint
      - name: Unit tests + challenge/problem validation
        run: npm test
      - name: Build
        run: npx vite build
      - name: Bundle size budget (entry + preloaded chunks, see scripts/check-bundle-size.ts)
        run: npm run size
      - name: Formatting (Prettier; run `npm run format` to fix)
        run: npm run format:check

  slow-crosschecks:
    # heavy second-route checks kept out of the default suite (non-blocking for the check job)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Transmission-line chapter on fine RLGC / LC ladders (npm run test:slow)
        run: npm run test:slow

  e2e:
    # browser tests of a production build (with the test hooks compiled in: VITE_E2E=1 → dist-e2e/)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build, preview, routes + bench suites (npm run e2e)
        run: npm run e2e
      - name: Screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-artifacts/
          if-no-files-found: ignore
